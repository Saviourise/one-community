name: Deploy to Cloudflare Pages

# Builds the site and deploys it to the Cloudflare Pages project
# "one-community-project" (https://one-community-project.pages.dev)
# on every push to main. Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   scoped token: Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=one-community-project --branch=main
