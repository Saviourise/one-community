  - main [ref=f5e26]:
    - generic [ref=f5e28]:
      - generic [ref=f5e29]: Our story
      - heading "Belonging isn’t found. It’s built, together." [level=1] [ref=f5e30]
      - paragraph [ref=f5e31]: "One Community Project began with a hunch: that the distance between neighbours is smaller than it feels, and that closing it changes everything."
    - generic [ref=f5e33]:
      - generic [ref=f5e35]:
        - paragraph [ref=f5e36]: We are a community of people who believe that connection is the most renewable resource we have. For over fifteen years we’ve turned ordinary moments into lasting relationships, across streets, generations and borders.
        - paragraph [ref=f5e37]: What started as a handful of small encounters has grown into a movement of shared tables, mentorships, screenings and welcomes. We measure success not in events run, but in people who now have someone to call.
        - paragraph [ref=f5e38]: We’re intentionally broad. Belonging is for everyone, the new arrival and the lifelong local, the student and the retiree, the shy and the sure.
      - img "Community members of different ages talking together" [ref=f5e40]
    - generic [ref=f5e43]:
      - generic [ref=f5e44]: Our mission
      - paragraph [ref=f5e45]: To build one stronger community with a sense of belonging, one small encounter at a time.
    - generic [ref=f5e46]:
      - generic [ref=f5e47]:
        - generic [ref=f5e48]: What we believe
        - heading "The values behind every encounter" [level=2] [ref=f5e49]
      - generic [ref=f5e50]:
        - generic [ref=f5e52]:
          - generic [ref=f5e53]: "01"
          - heading "People before programmes" [level=3] [ref=f5e54]
          - paragraph [ref=f5e55]: We start with the person in front of us. Structures exist to serve encounters, never the other way around.
        - generic [ref=f5e57]:
          - generic [ref=f5e58]: "02"
          - heading "Small is the strategy" [level=3] [ref=f5e59]
          - paragraph [ref=f5e60]: We don’t wait for grand gestures. A shared meal, a first hello, a door held open, small is where belonging is built.
        - generic [ref=f5e62]:
          - generic [ref=f5e63]: "03"
          - heading "Everyone belongs" [level=3] [ref=f5e64]
          - paragraph [ref=f5e65]: No age, postcode or background is a prerequisite. The circle is only ever drawn to include one more.
    - generic [ref=f5e66]:
      - generic [ref=f5e67]:
        - generic [ref=f5e68]: Recognitions
        - heading "Trusted, and glad to prove it" [level=2] [ref=f5e69]
        - paragraph [ref=f5e70]: Recognition helps us open doors, for grants, for partners, and for the people we serve.
