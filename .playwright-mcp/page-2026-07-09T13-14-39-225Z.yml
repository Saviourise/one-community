  - main [ref=f85e26]:
    - generic [ref=f85e28]:
      - generic [ref=f85e29]: Our story
      - heading "Belonging isn’t found. It’s built, together." [level=1] [ref=f85e30]
      - paragraph [ref=f85e31]: "One Community Project began with a hunch: that the distance between neighbours is smaller than it feels, and that closing it changes everything."
    - generic [ref=f85e33]:
      - generic [ref=f85e35]:
        - paragraph [ref=f85e36]: We are a community of people who believe that connection is the most renewable resource we have. Over the years we’ve turned ordinary moments into lasting relationships, across streets, generations and borders.
        - paragraph [ref=f85e37]: What started as a handful of small encounters has grown into a movement of shared tables, mentorships, screenings and welcomes. We measure success not in events run, but in people who now have someone to call.
        - paragraph [ref=f85e38]: We’re intentionally broad. Belonging is for everyone, the new arrival and the lifelong local, the student and the retiree, the shy and the sure.
      - img "Community members of different ages together" [ref=f85e40]
    - generic [ref=f85e43]:
      - generic [ref=f85e44]: Our mission
      - paragraph [ref=f85e45]: To build one stronger community with a sense of belonging, one small encounter at a time.
    - generic [ref=f85e46]:
      - generic [ref=f85e47]:
        - generic [ref=f85e48]: What we believe
        - heading "The values behind every encounter" [level=2] [ref=f85e49]
      - generic [ref=f85e50]:
        - generic [ref=f85e52]:
          - generic [ref=f85e53]: "01"
          - heading "People before programmes" [level=3] [ref=f85e54]
          - paragraph [ref=f85e55]: We start with the person in front of us. Structures exist to serve encounters, never the other way around.
        - generic [ref=f85e57]:
          - generic [ref=f85e58]: "02"
          - heading "Small is the strategy" [level=3] [ref=f85e59]
          - paragraph [ref=f85e60]: We don’t wait for grand gestures. A shared meal, a first hello, a door held open, small is where belonging is built.
        - generic [ref=f85e62]:
          - generic [ref=f85e63]: "03"
          - heading "Everyone belongs" [level=3] [ref=f85e64]
          - paragraph [ref=f85e65]: No age, postcode or background is a prerequisite. The circle is only ever drawn to include one more.
    - generic [ref=f85e66]:
      - generic [ref=f85e67]:
        - generic [ref=f85e68]: Recognitions
        - heading "Trusted, and glad to prove it" [level=2] [ref=f85e69]
        - paragraph [ref=f85e70]: Recognition helps us open doors, for grants, for partners, and for the people we serve.
